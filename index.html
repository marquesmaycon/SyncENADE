<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sync ENADE</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <img class="logo" src="assets/ideaton-logo.svg" alt="Logo Ideaton InovaDay">
    <main>
      <h1>Sync ENADE</h1>
      <p class="intro">Assine o calendario pelo link publico e confira se os eventos aparecem no calendario do usuario.</p>

      <section class="actions" aria-label="Acoes de calendario">
        <a id="apple-link" href="calendar.ics" target="_blank" rel="noopener">
          Apple Calendar
        </a>
        <a id="google-direct-link" href="https://calendar.google.com/calendar/render?cid=calendar.ics" target="_blank" rel="noopener">
          Google Calendar
        </a>
        <a id="outlook-link" href="calendar.ics" target="_blank" rel="noopener">
          Outlook
        </a>
        <button type="button" id="copy-link">
          Copiar URL do calendario
        </button>
      </section>

      <p class="manual">
        <code id="calendar-url">calendar.ics</code>
      </p>

      <p class="status" id="copy-status" aria-live="polite"></p>
    </main>

    <script>
      const feedUrl = new URL("calendar.ics", window.location.href).href;
      const webcalUrl = feedUrl.replace(/^https?:\/\//, "webcal://");
      const googleDirectUrl =
        "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(webcalUrl);

      document.getElementById("calendar-url").textContent = feedUrl;
      document.getElementById("apple-link").href = webcalUrl;
      document.getElementById("google-direct-link").href = googleDirectUrl;
      document.getElementById("outlook-link").href =
        "https://outlook.live.com/calendar/0/addcalendar?url=" + encodeURIComponent(feedUrl);

      document.getElementById("copy-link").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(feedUrl);
          document.getElementById("copy-status").textContent = "URL copiada.";
        } catch {
          document.getElementById("copy-status").textContent =
            "Copie a URL exibida acima.";
        }
      });
    </script>
  </body>
</html>
